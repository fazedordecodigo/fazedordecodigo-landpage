name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript
        run: npm install --no-save typescript@7

      - name: Transpile TypeScript
        run: npx tsc

      - name: Inject Web3Forms access key
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: |
          if [ -z "$WEB3FORMS_ACCESS_KEY" ]; then
            echo "secret ausente, mantendo placeholder"
            exit 0
          fi
          grep -q 'YOUR_WEB3FORMS_ACCESS_KEY' index.html || { echo "placeholder não encontrado em index.html"; exit 1; }
          sed -i "s/YOUR_WEB3FORMS_ACCESS_KEY/${WEB3FORMS_ACCESS_KEY}/" index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
